<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>紫羽GAME TierMaker風</title>
<style>
:root {
  --bg:#09070d; --panel:#15101b; --line:#4a3c59; --text:#f7f3fb; --muted:#b8acc5;
  --ss:#7b2f67; --s:#6d3d88; --a:#4f4d87; --b:#3b536f; --c:#39404d;
  --card:52px; --gap:4px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#050408;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
body{min-height:100%}
#viewport{width:100%;display:flex;justify-content:center;align-items:flex-start;background:#050408}
#app{
  width:min(100%,1920px);
  min-height:720px;
  background:radial-gradient(circle at 50% 0%,#1a1023 0,#0b0810 48%,#070509 100%);
  padding:14px;
  display:grid;
  grid-template-rows:auto auto auto;
  gap:10px;
  overflow:visible;
}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:rgba(21,16,27,.96);border:1px solid #2f2538;border-radius:10px}
.toolbar strong{font-size:18px;margin-right:auto}
button,select{background:#2a2033;color:var(--text);border:1px solid #5d4d6d;border-radius:8px;padding:7px 10px;font:inherit}
button{cursor:pointer}
button.danger{background:#5b1f35;border-color:#a64b6b}
button.danger.active{background:#8a294d;border-color:#ff8aad;box-shadow:0 0 0 2px rgba(255,138,173,.2)}
.status{color:var(--muted);font-size:13px}
.board{display:grid;grid-template-rows:repeat(5,auto);gap:6px;min-height:0}
.tier{display:grid;grid-template-columns:90px 1fr;min-height:64px;border:1px solid var(--line);border-radius:10px;overflow:visible;background:#100c15}
.label{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px;letter-spacing:.03em}
.label.ss{background:linear-gradient(180deg,#8b3b76,#532046)} 
.label.s{background:linear-gradient(180deg,#8250a2,#513464)} 
.label.a{background:linear-gradient(180deg,#5f61a0,#3f416d)} 
.label.b{background:linear-gradient(180deg,#48647f,#30465a)} 
.label.c{background:linear-gradient(180deg,#505764,#343a45)}
.zone{min-width:0;min-height:0;display:flex;align-content:center;align-items:flex-start;flex-wrap:wrap;gap:var(--gap);padding:5px;position:relative;overflow:hidden}
.tier .zone{
  display:grid;
  grid-template-columns:repeat(12,var(--card));
  grid-auto-rows:var(--card);
  align-content:start;
  justify-content:start;
  gap:var(--gap);
  min-height:calc(var(--card) + 10px);
  padding:5px;
  overflow:visible;
}
.zone.dragover{outline:3px solid #b58bd2;outline-offset:-3px;background:#1d1426}
.card{
  width:var(--card);height:var(--card);flex:0 0 var(--card);
  border-radius:6px;border:1px solid #81708d;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  cursor:grab;box-shadow:0 1px 0 rgba(255,255,255,.12) inset;position:relative;padding:0
}
.card:active{cursor:grabbing}
.card{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.touch-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.88;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.touch-target{outline:3px solid #b58bd2!important;outline-offset:-3px!important;background:#1d1426!important}
.card.selected{outline:3px solid #fff;outline-offset:1px}
.card.bulk-selected{outline:4px solid #ff7ca8;outline-offset:1px;box-shadow:0 0 0 2px #401328,0 0 14px rgba(255,124,168,.75)}
.label{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.label.tap-ready{outline:3px solid #fff;outline-offset:-4px;filter:brightness(1.18)}
.card.dragging{opacity:.35}
.waiting-wrap{border:1px solid #3e2d4c;border-radius:12px;overflow:visible;background:#100b15;min-height:0;display:grid;grid-template-rows:38px auto}
.waiting-head{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#281b35;font-weight:800}
.waiting{
  padding:8px;
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  align-content:flex-start;
  justify-content:flex-start;
  overflow:visible;
  scrollbar-width:thin;
  scrollbar-color:#654b77 #17101f
}
.waiting::-webkit-scrollbar{width:10px}
.waiting::-webkit-scrollbar-track{background:#17101f}
.waiting::-webkit-scrollbar-thumb{background:#654b77;border-radius:8px}
.hint{font-size:12px;color:var(--muted);font-weight:500}
.obs .toolbar{display:none}
.obs #app{grid-template-rows:auto auto;padding:10px;gap:8px}
.obs .board{gap:5px}
.obs .tier{grid-template-columns:82px 1fr}
.obs .label{font-size:28px}
.obs .waiting-head{height:36px}
@media(max-width:1200px){
  :root{--card:46px}
  #app{min-height:650px;grid-template-rows:auto minmax(0,1fr) 280px}
  .tier{grid-template-columns:72px 1fr}
  .label{font-size:24px}
}
@media(max-width:800px){
  #app{aspect-ratio:auto;min-height:900px;grid-template-rows:auto minmax(520px,1fr) 320px;padding:8px}
  .tier{grid-template-columns:56px 1fr}
  .label{font-size:18px}
  :root{--card:42px}
}

/* 12体固定折り返し：画面幅に応じてカードを縮小し、見切れを防止 */
@media(max-width:1200px){
  :root{--card:min(46px,calc((100vw - 130px) / 12))}
}
@media(max-width:800px){
  :root{--card:min(42px,calc((100vw - 88px) / 12))}
  #app{min-height:0;grid-template-rows:auto auto auto;padding:8px}
  .tier{grid-template-columns:56px 1fr}
  .label{font-size:18px}
}

</style>
<meta name="theme-color" content="#09070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="紫羽 TierMaker">
</head>
<body>
<div id="viewport">
<div id="app">
  <div class="toolbar">
    <strong>紫羽GAME Tier Board</strong>
    <span class="status" id="status">PC：ドラッグ｜スマホ：キャラをタップ→Tier名をタップ（長押し移動も可）</span>
    <label>選択中を移動
      <select id="moveSelect">
        <option value="">移動先</option><option value="SSS">SSS</option><option value="SS">SS</option><option value="S">S</option><option value="A">A</option><option value="B">B</option><option value="WAITING">WAITING</option>
      </select>
    </label>
    <button type="button" id="reset">リセット</button>
    <button type="button" id="deleteSelected">選択キャラを削除</button>
    <button type="button" id="bulkDeleteToggle" class="danger">キャラをまとめて削除</button>
    <button type="button" id="bulkDeleteApply" class="danger" hidden>選択した0体を削除</button>
    <button type="button" id="bulkDeleteCancel" hidden>キャンセル</button>
    <span id="autosaveBadge" style="padding:7px 10px;border:1px solid #4f6f58;border-radius:8px;background:#17311f;color:#dff7e5;font-size:13px;font-weight:700">自動保存：ON</span>
    <label>手動保存
      <select id="manualSlot">
        <option value="1">枠1</option>
        <option value="2">枠2</option>
        <option value="3">枠3</option>
      </select>
    </label>
    <button type="button" id="manualSave">保存</button>
    <button type="button" id="manualLoad">読込</button>
    <button type="button" id="exportPng">Tier表を画像保存</button>
    <button type="button" id="obsMode">OBSモード</button>
  </div>

  <div class="board">
    <div class="tier"><div class="label ss">SSS</div><div class="zone" data-tier="SSS"></div></div>
    <div class="tier"><div class="label s">SS</div><div class="zone" data-tier="SS"></div></div>
    <div class="tier"><div class="label a">S</div><div class="zone" data-tier="S"></div></div>
    <div class="tier"><div class="label b">A</div><div class="zone" data-tier="A"></div></div>
    <div class="tier"><div class="label c">B</div><div class="zone" data-tier="B"></div></div>
  </div>

  <section class="waiting-wrap">
    <div class="waiting-head"><span id="waitingTitle">WAITING / 未評価キャラ</span><span class="hint">スマホ：キャラをタップ→Tier名をタップ｜長押し移動も可</span></div>
    <div class="zone waiting" data-tier="WAITING"></div>
  </section>
</div>
</div>

<script>
(() => {
  const waiting=document.querySelector('[data-tier="WAITING"]');
  const zones=[...document.querySelectorAll('.zone')];
  const status=document.getElementById('status');
  const moveSelect=document.getElementById('moveSelect');
  const bulkDeleteToggle=document.getElementById('bulkDeleteToggle');
  const bulkDeleteApply=document.getElementById('bulkDeleteApply');
  const bulkDeleteCancel=document.getElementById('bulkDeleteCancel');
  const desktopDnD=window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  let selected=null, dragged=null;
  let bulkDeleteMode=false;
  const bulkSelected=new Set();
  const pointerState={
    active:false, card:null, ghost:null, pointerId:null,
    startX:0,startY:0,lastX:0,lastY:0,timer:null,justDragged:false
  };

  function zoneAtPoint(x,y){
    const hit=document.elementFromPoint(x,y);
    return hit ? hit.closest('.zone') : null;
  }
  function clearPointerTargets(){ zones.forEach(z=>z.classList.remove('touch-target')); }
  function updateTapTargets(){
    document.querySelectorAll('.label').forEach(l=>l.classList.toggle('tap-ready',!!selected && !bulkDeleteMode));
  }
  function updateBulkDeleteUi(){
    bulkDeleteToggle.classList.toggle('active',bulkDeleteMode);
    bulkDeleteApply.hidden=!bulkDeleteMode;
    bulkDeleteCancel.hidden=!bulkDeleteMode;
    bulkDeleteApply.textContent='選択した'+bulkSelected.size+'体を削除';
  }
  function clearBulkSelection(){
    bulkSelected.forEach(card=>card.classList.remove('bulk-selected'));
    bulkSelected.clear();
    updateBulkDeleteUi();
  }
  function enterBulkDeleteMode(){
    bulkDeleteMode=true;
    if(selected){ selected.classList.remove('selected'); selected=null; }
    updateTapTargets();
    clearBulkSelection();
    updateBulkDeleteUi();
    status.textContent='まとめて削除：削除したいキャラを複数タップしてください。';
  }
  function exitBulkDeleteMode(message){
    clearBulkSelection();
    bulkDeleteMode=false;
    updateBulkDeleteUi();
    updateTapTargets();
    if(message) status.textContent=message;
  }
  function toggleBulkCard(card){
    if(bulkSelected.has(card)){
      bulkSelected.delete(card);
      card.classList.remove('bulk-selected');
    }else{
      bulkSelected.add(card);
      card.classList.add('bulk-selected');
    }
    updateBulkDeleteUi();
    status.textContent='まとめて削除：'+bulkSelected.size+'体を選択中';
  }
  function selectCard(card){
    if(bulkDeleteMode){ toggleBulkCard(card); return; }
    document.querySelectorAll('.card.selected').forEach(c=>c.classList.remove('selected'));
    selected=card; card.classList.add('selected'); updateTapTargets();
    status.textContent='選択中：'+card.title+'｜移動先の SS / S / A / B / C をタップ';
  }
  function moveSelectedToTier(tier){
    if(!selected || bulkDeleteMode) return;
    const zone=document.querySelector(`[data-tier="${tier}"]`);
    if(!zone) return;
    const name=selected.title; zone.appendChild(selected);
    selected.classList.remove('selected'); selected=null; updateTapTargets(); updateWaitingTitle();
    status.textContent=name+' → '+tier+' に配置';
  }

  document.querySelectorAll('.tier .label').forEach(label=>{
    label.addEventListener('click',e=>{
      if(!selected || bulkDeleteMode) return;
      e.preventDefault();
      const zone=label.parentElement.querySelector('.zone');
      if(zone) moveSelectedToTier(zone.dataset.tier);
    });
  });

  function beginPointerDrag(card,e){
    if(bulkDeleteMode) return;
    pointerState.card=card; pointerState.pointerId=e.pointerId;
    pointerState.startX=e.clientX; pointerState.startY=e.clientY;
    pointerState.lastX=e.clientX; pointerState.lastY=e.clientY;
    pointerState.active=false; clearTimeout(pointerState.timer);
    pointerState.timer=setTimeout(()=>{
      pointerState.active=true; pointerState.justDragged=true; card.classList.add('dragging');
      try{ card.setPointerCapture(e.pointerId); }catch(_){}
      const g=card.cloneNode(true);
      g.classList.remove('dragging','selected','bulk-selected');
      g.classList.add('touch-ghost'); g.removeAttribute('id');
      document.body.appendChild(g); pointerState.ghost=g;
      moveGhost(e.clientX,e.clientY);
      status.textContent=card.title+' を移動中…';
    },260);
  }
  function moveGhost(x,y){
    if(pointerState.ghost){ pointerState.ghost.style.left=x+'px'; pointerState.ghost.style.top=y+'px'; }
  }
  function finishPointerDrag(e){
    clearTimeout(pointerState.timer);
    const card=pointerState.card;
    if(pointerState.active && card){
      const zone=zoneAtPoint(e.clientX,e.clientY);
      if(zone){
        const ref=nearestReference(zone,e.clientX,e.clientY);
        zone.insertBefore(card,ref);
        status.textContent=card.title+' → '+zone.dataset.tier+' に配置';
      }else status.textContent='配置先のTier上で指を離してください。';
    }
    if(card) card.classList.remove('dragging');
    if(pointerState.ghost) pointerState.ghost.remove();
    clearPointerTargets();
    pointerState.active=false; pointerState.card=null; pointerState.ghost=null; pointerState.pointerId=null;
  }

  document.addEventListener('pointermove',e=>{
    if(pointerState.pointerId!==e.pointerId || !pointerState.card) return;
    pointerState.lastX=e.clientX; pointerState.lastY=e.clientY;
    const dx=e.clientX-pointerState.startX, dy=e.clientY-pointerState.startY;
    if(!pointerState.active){
      if(Math.hypot(dx,dy)>12){
        clearTimeout(pointerState.timer);
        pointerState.card=null; pointerState.pointerId=null;
      }
      return;
    }
    e.preventDefault(); moveGhost(e.clientX,e.clientY); clearPointerTargets();
    const zone=zoneAtPoint(e.clientX,e.clientY);
    if(zone) zone.classList.add('touch-target');
  },{passive:false});
  document.addEventListener('pointerup',e=>{
    if(pointerState.pointerId===e.pointerId && pointerState.card) finishPointerDrag(e);
  });
  document.addEventListener('pointercancel',e=>{
    if(pointerState.pointerId===e.pointerId && pointerState.card) finishPointerDrag(e);
  });
  document.addEventListener('lostpointercapture',e=>{
    if(pointerState.pointerId===e.pointerId && pointerState.card && pointerState.active){
      finishPointerDrag({clientX:pointerState.lastX,clientY:pointerState.lastY});
    }
  },true);

  function makeCard(n) {
    const el=document.createElement('button');
    el.type='button'; el.className='card'; el.draggable=desktopDnD;
    el.dataset.id=String(n);
    el.style.backgroundImage='url('+CHARACTER_IMAGES[n-1]+')';
    el.title=n===1 ? '追加キャラ' : 'キャラ '+String(n).padStart(2,'0');
    el.setAttribute('aria-label',el.title);
    el.addEventListener('click',()=>{
      if(pointerState.justDragged){ pointerState.justDragged=false; return; }
      selectCard(el);
    });
    el.addEventListener('dragstart',e=>{
      if(!desktopDnD || pointerState.active || bulkDeleteMode){ e.preventDefault(); return; }
      dragged=el; el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',el.dataset.id);
    });
    el.addEventListener('dragend',()=>{
      el.classList.remove('dragging'); dragged=null;
      zones.forEach(z=>z.classList.remove('dragover'));
    });
    el.addEventListener('pointerdown',e=>{
      if(bulkDeleteMode) return;
      if(e.pointerType==='mouse' && desktopDnD) return;
      beginPointerDrag(el,e);
    });
    el.addEventListener('contextmenu',e=>e.preventDefault());
    return el;
  }
  function nearestReference(zone,x,y) {
    const cards=[...zone.querySelectorAll('.card:not(.dragging)')];
    if(!cards.length) return null;
    let best=null, dist=Infinity;
    for(const card of cards) {
      const r=card.getBoundingClientRect();
      const cx=r.left+r.width/2, cy=r.top+r.height/2;
      const d=Math.hypot(x-cx,(y-cy)*1.2);
      if(d<dist){dist=d;best={card,cx,cy,r};}
    }
    if(!best) return null;
    const before = y < best.cy-8 || (Math.abs(y-best.cy)<=best.r.height/2 && x<best.cx);
    return before ? best.card : best.card.nextSibling;
  }

  zones.forEach(zone=>{
    zone.addEventListener('dragover',e=>{
      if(bulkDeleteMode) return;
      e.preventDefault(); e.dataTransfer.dropEffect='move'; zone.classList.add('dragover');
    });
    zone.addEventListener('dragleave',e=>{
      if(!zone.contains(e.relatedTarget)) zone.classList.remove('dragover');
    });
    zone.addEventListener('drop',e=>{
      if(bulkDeleteMode) return;
      e.preventDefault(); zone.classList.remove('dragover');
      if(!dragged) return;
      const ref=nearestReference(zone,e.clientX,e.clientY);
      zone.insertBefore(dragged,ref);
      status.textContent=dragged.title+' → '+zone.dataset.tier+' に配置';
    });
  });

  moveSelect.addEventListener('change',()=>{
    if(bulkDeleteMode || !selected || !moveSelect.value){ moveSelect.value=''; return; }
    const name=selected.title;
    document.querySelector(`[data-tier="${moveSelect.value}"]`).appendChild(selected);
    selected.classList.remove('selected'); selected=null; updateTapTargets();
    updateWaitingTitle(); status.textContent=name+' → '+moveSelect.value+' に移動'; moveSelect.value='';
  });

  document.getElementById('reset').addEventListener('click',()=>{
    document.querySelectorAll('.card').forEach(c=>c.remove());
    selected=null; bulkDeleteMode=false; bulkSelected.clear();
    updateBulkDeleteUi(); updateTapTargets();
    getInitialRoster().forEach(n=>waiting.appendChild(makeCard(n)));
    updateWaitingTitle();
    status.textContent=getInitialRoster().length+'体を初期状態に戻しました。';
    queueAutoSave();
  });

  function deleteSelectedCard(){
    if(bulkDeleteMode){
      status.textContent='まとめて削除モード中です。複数選択して「選択した○体を削除」を押してください。';
      return;
    }
    if(!selected){ status.textContent='削除するキャラを先にクリックしてください。'; return; }
    const name=selected.title || '選択キャラ';
    selected.remove(); selected=null; updateTapTargets();
    updateWaitingTitle();
    status.textContent=name+' を削除しました。';
  }
  document.getElementById('deleteSelected').addEventListener('click',deleteSelectedCard);

  bulkDeleteToggle.addEventListener('click',()=>{
    if(bulkDeleteMode) exitBulkDeleteMode('まとめて削除をキャンセルしました。');
    else enterBulkDeleteMode();
  });
  bulkDeleteCancel.addEventListener('click',()=>{
    exitBulkDeleteMode('まとめて削除をキャンセルしました。');
  });
  bulkDeleteApply.addEventListener('click',()=>{
    if(!bulkDeleteMode) return;
    const count=bulkSelected.size;
    if(!count){ status.textContent='削除するキャラを1体以上選択してください。'; return; }
    if(!window.confirm('選択した'+count+'体のキャラを削除しますか？')) return;
    [...bulkSelected].forEach(card=>card.remove());
    bulkSelected.clear(); bulkDeleteMode=false;
    updateBulkDeleteUi(); updateTapTargets(); updateWaitingTitle();
    status.textContent=count+'体のキャラをまとめて削除しました。';
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && bulkDeleteMode){
      exitBulkDeleteMode('まとめて削除をキャンセルしました。'); return;
    }
    if((e.key==='Delete' || e.key==='Backspace') && selected && !bulkDeleteMode){
      const tag=(document.activeElement && document.activeElement.tagName) || '';
      if(tag==='INPUT' || tag==='SELECT' || tag==='TEXTAREA') return;
      e.preventDefault(); deleteSelectedCard();
    }
  });

  const STORAGE_KEY='shiuTierMaker65_SSS_autosave_v6';
  const MANUAL_KEY_PREFIX='shiuTierMaker65_SSS_manual_v1_slot_';
  let autosaveReady=false;

  function idsFromLayout(data){
    const ids=[];
    ['SSS','SS','S','A','B','WAITING'].forEach(tier=>{
      (data && data[tier] || []).forEach(id=>{
        id=Number(id);
        if(Number.isInteger(id) && id>=1 && id<=65 && !ids.includes(id)) ids.push(id);
      });
    });
    return ids;
  }
  function getInitialRoster(){
    return [...FIXED_ROSTER];
  }
  function updateWaitingTitle(){
    const el=document.getElementById('waitingTitle');
    if(!el) return;
    const total=document.querySelectorAll('.card').length;
    const wait=waiting.querySelectorAll('.card').length;
    el.textContent='WAITING / 未評価キャラ '+wait+'体（登録 '+total+'体）';
  }

  function currentLayout(){
    const data={};
    zones.forEach(z=>{ data[z.dataset.tier]=[...z.querySelectorAll('.card')].map(c=>Number(c.dataset.id)); });
    return data;
  }

  function writeLayout(key, message){
    try{
      localStorage.setItem(key,JSON.stringify(currentLayout()));
      updateWaitingTitle();
      if(message) status.textContent=message;
      return true;
    }catch(e){
      status.textContent='保存できませんでした。ブラウザ設定をご確認ください。';
      return false;
    }
  }

  function queueAutoSave(){
    if(!autosaveReady) return;
    clearTimeout(autoSaveTimer);
    autoSaveTimer=setTimeout(()=>{
      try{
        localStorage.setItem(STORAGE_KEY,JSON.stringify(currentLayout()));
        const badge=document.getElementById('autosaveBadge');
        if(badge){
          const d=new Date();
          badge.textContent='自動保存：ON '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
        }
      }catch(e){}
    },180);
  }

  function applyLayout(data){
    if(!data || typeof data!=='object') return false;

    autosaveReady=false;
    clearTimeout(autoSaveTimer);

    document.querySelectorAll('.card').forEach(c=>c.remove());
    selected=null;
    bulkDeleteMode=false;
    bulkSelected.clear();
    updateBulkDeleteUi();
    updateTapTargets();

    const seen=new Set();
    ['SSS','SS','S','A','B','WAITING'].forEach(tier=>{
      const zone=document.querySelector(`[data-tier="${tier}"]`);
      (data[tier]||[]).forEach(rawId=>{
        const id=Number(rawId);
        if(!Number.isInteger(id) || id<1 || id>65 || seen.has(id)) return;
        seen.add(id);
        zone.appendChild(makeCard(id));
      });
    });

    updateWaitingTitle();
    autosaveReady=true;
    return true;
  }

  function readLayout(key){
    try{
      const raw=localStorage.getItem(key);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){
      return null;
    }
  }

  function restoreLayout(){
    const data=readLayout(STORAGE_KEY);
    return data ? applyLayout(data) : false;
  }

  function manualKey(){
    return MANUAL_KEY_PREFIX+document.getElementById('manualSlot').value;
  }

  document.getElementById('manualSave').addEventListener('click',()=>{
    const slot=document.getElementById('manualSlot').value;
    writeLayout(manualKey(),'手動保存 枠'+slot+' に保存しました。');
  });

  document.getElementById('manualLoad').addEventListener('click',()=>{
    const slot=document.getElementById('manualSlot').value;
    const data=readLayout(manualKey());
    if(!data){
      status.textContent='手動保存 枠'+slot+' にはまだデータがありません。';
      return;
    }
    if(applyLayout(data)){
      writeLayout(STORAGE_KEY);
      status.textContent='手動保存 枠'+slot+' を読み込みました。';
    }
  });

  const autoObserver=new MutationObserver(()=>queueAutoSave());
  zones.forEach(z=>autoObserver.observe(z,{childList:true}));

  document.getElementById('exportPng').addEventListener('click',async()=>{
    status.textContent='画像を作成しています…';
    try{
      const W=1920,labelW=150,gap=10,top=30,bottom=30,card=90,cgap=8,padY=8;
      const tiers=['SSS','SS','S','A','B'];
      const tierData=tiers.map(tier=>({
        tier,
        ids:[...document.querySelector(`[data-tier="${tier}"]`).querySelectorAll('.card')].map(c=>Number(c.dataset.id))
      }));

      // 画像保存も1段12体で折り返す。人数に応じて各Tierと画像全体の高さを自動拡張。
      const rowCounts=tierData.map(d=>Math.max(1,Math.ceil(d.ids.length/12)));
      const tierHeights=rowCounts.map(rows=>Math.max(110,padY*2+rows*card+(rows-1)*cgap));
      const H=top+bottom+tierHeights.reduce((sum,h)=>sum+h,0)+gap*(tiers.length-1);

      const canvas=document.createElement('canvas');
      canvas.width=W; canvas.height=H;
      const ctx=canvas.getContext('2d');

      const grad=ctx.createLinearGradient(0,0,0,H);
      grad.addColorStop(0,'#171020'); grad.addColorStop(1,'#070509');
      ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

      const exportImages=await Promise.all(CHARACTER_IMAGES.map(src=>new Promise((resolve,reject)=>{
        const im=new Image(); im.onload=()=>resolve(im); im.onerror=reject; im.src=src;
      })));

      const labelColors=['#6d2d5d','#65407e','#4d4e83','#3b536f','#39404d'];
      let y=top;

      tierData.forEach((data,ri)=>{
        const rowH=tierHeights[ri];
        ctx.fillStyle='#110d16';
        ctx.fillRect(20,y,W-40,rowH);

        ctx.fillStyle=labelColors[ri];
        ctx.fillRect(20,y,labelW,rowH);

        ctx.fillStyle='#fff';
        ctx.font='bold 54px sans-serif';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText(data.tier,20+labelW/2,y+rowH/2);

        data.ids.forEach((id,i)=>{
          const col=i%12;
          const row=Math.floor(i/12);
          const dx=190+col*(card+cgap);
          const dy=y+padY+row*(card+cgap);
          const charImg=exportImages[id-1];
          if(charImg){
            ctx.drawImage(charImg,0,0,charImg.naturalWidth,charImg.naturalHeight,dx,dy,card,card);
          }
          ctx.strokeStyle='rgba(255,255,255,.35)';
          ctx.lineWidth=2;
          ctx.strokeRect(dx,dy,card,card);
        });

        y+=rowH+gap;
      });

      const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='紫羽GAME_Tier表.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      status.textContent='Tier表を12体折り返しでPNG画像保存しました。';
    }catch(e){
      console.error(e);
      status.textContent='画像保存に失敗しました。';
    }
  });

  document.getElementById('obsMode').addEventListener('click',()=>{
    document.body.classList.toggle('obs');
    status.textContent=document.body.classList.contains('obs')
      ? 'OBSモード：1920×1080向け表示'
      : '通常モードに戻しました。';
  });



  const savedAuto=readLayout(STORAGE_KEY);
  let restored=false;
  if(savedAuto){
    restored=applyLayout(savedAuto);
  }else{
    autosaveReady=false;
    getInitialRoster().forEach(n=>waiting.appendChild(makeCard(n)));
    updateWaitingTitle();
    autosaveReady=true;
    writeLayout(STORAGE_KEY);
  }
  autosaveReady=true;
  updateWaitingTitle();
  if(restored) status.textContent='自動保存した配置を復元しました。';
  else status.textContent='65体のキャラを読み込みました。自動保存はONです。';
})();
</script>
